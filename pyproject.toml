[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livebrief"
version = "0.1.0"
description = "LiveBrief - Real-time AI research & briefing engine with low-latency Moss retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "moss>=1.12.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "typing_extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
livebrief = "livebrief.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["livebrief*"]
exclude = ["samples*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
